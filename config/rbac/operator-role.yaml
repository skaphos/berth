# NON-AUTHORITATIVE reference manifest — DO NOT deploy from this file.
#
# The Helm chart is the deployment authority: deploy/helm/berth-operator
# renders the operator's RBAC from templates/clusterrole.yaml driven by
# values.yaml `rbac.*`. Nothing consumes this file (no kustomization, no CI),
# and it is NOT covered by the `verify-generated` drift gate. There are no
# +kubebuilder:rbac markers in the repo, so the rules below are hand-maintained
# and must be kept in sync with `values.yaml` `rbac.*` by hand. It exists as a
# single readable summary of the permissions the operator needs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: berth-operator
  namespace: berth-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: berth-operator
rules:
  - apiGroups: ["berth.skaphos.io"]
    resources: ["berthleases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["berth.skaphos.io"]
    resources: ["berthleases/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["berth.skaphos.io"]
    resources: ["berthleases/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["update", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Leader election (Helm `leaderElection.enabled: true`, off by default) needs
  # get/list/watch/create/update/patch/delete on coordination.k8s.io/leases, but
  # only in the operator's OWN namespace — grant it via a namespaced Role +
  # RoleBinding, NOT here in the cluster-wide ClusterRole. (The Helm chart renders
  # this as templates/leader-election-rbac.yaml.)
  # Uncomment for the authenticated metrics endpoint (Helm `metrics.secure: true`).
  # The operator SA also needs the built-in `system:auth-delegator` ClusterRole;
  # the Helm chart binds it directly instead of inlining these rules:
  # - apiGroups: ["authentication.k8s.io"]
  #   resources: ["tokenreviews"]
  #   verbs: ["create"]
  # - apiGroups: ["authorization.k8s.io"]
  #   resources: ["subjectaccessreviews"]
  #   verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: berth-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: berth-operator
subjects:
  - kind: ServiceAccount
    name: berth-operator
    namespace: berth-system
