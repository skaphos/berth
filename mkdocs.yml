site_name: Berth
site_description: Distributed lease coordination for Kubernetes multi-cluster workloads.
site_url: https://skaphos.github.io/berth/
repo_url: https://github.com/skaphos/berth
repo_name: skaphos/berth
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.action.edit
    - content.code.copy

extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Code Map: code-map.md
  - Reference:
      - API: reference/api.md
      - Configuration: reference/configuration.md
