name: e2e

# Cross-cluster singleton e2e suite. Runtime ~5-10 min — not gating on
# every PR. Triggered nightly (catch regressions before they pile up)
# and manually via workflow_dispatch.

on:
  schedule:
    # 03:00 UTC daily — quiet hours for the org.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run at a time per branch — kind cluster names are global on a
  # given runner and parallel runs would collide.
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          install_only: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Bring up topology
        run: go -C tools tool task e2e-up

      - name: Run scenarios
        run: go -C tools tool task e2e

      - name: Collect cluster state on failure
        if: failure()
        run: |
          set +e
          mkdir -p artifacts
          for cluster in berth-e2e-coord berth-e2e-east berth-e2e-west; do
            context="kind-$cluster"
            kubectl --context "$context" get nodes,po,deploy,svc,berthlease -A -o wide \
              > "artifacts/$cluster-resources.txt" 2>&1
            kubectl --context "$context" describe pod -n berth-system \
              > "artifacts/$cluster-pods-describe.txt" 2>&1
            for pod in $(kubectl --context "$context" -n berth-system get pods -o name); do
              kubectl --context "$context" -n berth-system logs "$pod" --tail=500 \
                > "artifacts/$cluster-${pod#pod/}.log" 2>&1
            done
            kubectl --context "$context" get berthlease -A -o yaml \
              > "artifacts/$cluster-berthleases.yaml" 2>&1
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-artifacts
          path: artifacts/
          retention-days: 7

      - name: Tear down topology
        if: always()
        run: go -C tools tool task e2e-down
