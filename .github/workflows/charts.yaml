name: charts

on:
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/charts.yaml"
      - "config/crd/**"
  push:
    branches:
      - main
    paths:
      - "deploy/helm/**"
      - ".github/workflows/charts.yaml"
      - "config/crd/**"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

      - name: Run ct lint
        run: ct lint --config .github/ct.yaml

  install:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f  # v2.8.0

      - name: Build local images
        run: |
          docker build -f Dockerfile.apiserver -t berth-apiserver:ci .
          docker build -f Dockerfile.operator -t berth-operator:ci .
          docker build -f Dockerfile.broker -t berth-oidc-broker:ci .

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1.14.0
        with:
          wait: 120s

      - name: Load local images into kind
        run: |
          CLUSTER_NAME=$(kind get clusters | head -1)
          kind load docker-image berth-apiserver:ci --name "$CLUSTER_NAME"
          kind load docker-image berth-operator:ci --name "$CLUSTER_NAME"
          kind load docker-image berth-oidc-broker:ci --name "$CLUSTER_NAME"

      - name: Install cert-manager
        # The berth-operator injection ci values issue the webhook serving
        # cert via cert-manager (its primary TLS path). Install it and a
        # self-signed ClusterIssuer the chart's Certificate references.
        run: |
          set -euo pipefail
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.20.3/cert-manager.yaml
          kubectl -n cert-manager rollout status deploy/cert-manager --timeout=180s
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s
          kubectl -n cert-manager rollout status deploy/cert-manager-cainjector --timeout=180s

      - name: Pre-create chart test fixtures
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/tls.key -out /tmp/tls.crt \
            -days 1 -subj "/CN=berth-apiserver.default.svc"
          kubectl create secret tls berth-apiserver-test-tls \
            --cert=/tmp/tls.crt --key=/tmp/tls.key
          printf 'test:%s' "$(printf 'test' | sha256sum | cut -d' ' -f1)" \
            > /tmp/api-keys
          kubectl create secret generic berth-api-keys \
            --from-file=api-keys=/tmp/api-keys
          CLUSTER_NAME=$(kind get clusters | head -1)
          # --internal yields the in-cluster API address
          # (<cluster>-control-plane:6443), which the external-kubeconfig
          # apiserver pod can reach. The default kubeconfig points at the
          # host-side 127.0.0.1:<port>, unreachable from inside a pod, so its
          # /readyz (Store.Ping) never succeeds now that readiness gates on
          # backend reachability (SKA-450) and ct install times out.
          kind get kubeconfig --name "$CLUSTER_NAME" --internal > /tmp/coord-kubeconfig
          kubectl create secret generic berth-coordination-kubeconfig \
            --from-file=kubeconfig=/tmp/coord-kubeconfig
          kubectl create namespace berth-coordination
          kubectl create secret generic berth-sqlite-dsn \
            --from-literal=dsn='file:/tmp/berth.db?cache=shared'
          kubectl create secret generic berth-api-key --from-literal=api-key=test
          kubectl create configmap berth-ca-bundle --from-file=ca.crt=/tmp/tls.crt
          kubectl create secret generic berth-oidc-client --from-literal=client-secret=test

          # Pre-create a stable SA + Role/RoleBinding granting it coordination
          # Lease access. Used by ci/incluster-values.yaml (serviceAccount.name
          # + create: false). This guarantees the apiserver's /readyz probe
          # (Store.Ping via the in-cluster client) succeeds on first attempt,
          # satisfying the post-SKA-450 expectation that readiness implies
          # usable backend. The chart will still render its own (randomly
          # named) Role+Binding for its generated fullname; the extra grant
          # on our stable SA is harmless.
          sed 's/^          //' <<'RBAC_EOF' | kubectl apply -f -
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: berth-apiserver-ci
            namespace: default
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: Role
          metadata:
            name: berth-apiserver-ci-coordination
            namespace: berth-coordination
          rules:
            - apiGroups: ["coordination.k8s.io"]
              resources: ["leases"]
              verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: RoleBinding
          metadata:
            name: berth-apiserver-ci-coordination
            namespace: berth-coordination
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: berth-apiserver-ci-coordination
          subjects:
            - kind: ServiceAccount
              name: berth-apiserver-ci
              namespace: default
          RBAC_EOF

          printf 'apiVersion: cert-manager.io/v1\nkind: ClusterIssuer\nmetadata:\n  name: berth-ca\nspec:\n  selfSigned: {}\n' | kubectl apply -f -

      - name: Deploy Berth apiserver fixture
        # The berth-operator chart's /readyz pings the central Berth API
        # (SKA-450), so the operator pod only becomes Ready when that API is
        # reachable. ct installs the operator chart in isolation (the apiserver
        # chart is a separate release), so stand up a minimal in-cluster Berth
        # apiserver (mem backend, no auth, test TLS) the operator ci values
        # point at via berth-apiserver.default.svc. Without this, ct install
        # times out waiting for the operator Deployment to go Available.
        run: |
          set -euo pipefail
          kubectl apply -f - <<'APISERVER_EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: berth-apiserver
            namespace: default
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: berth-apiserver-fixture
            template:
              metadata:
                labels:
                  app: berth-apiserver-fixture
              spec:
                containers:
                  - name: apiserver
                    image: berth-apiserver:ci
                    imagePullPolicy: IfNotPresent
                    args:
                      - --listen-addr=:8443
                      - --store-backend=mem
                      - --auth-mode=none
                      - --metrics-addr=
                      - --tls-cert-file=/tls/tls.crt
                      - --tls-key-file=/tls/tls.key
                    ports:
                      - containerPort: 8443
                    volumeMounts:
                      - name: tls
                        mountPath: /tls
                        readOnly: true
                volumes:
                  - name: tls
                    secret:
                      secretName: berth-apiserver-test-tls
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: berth-apiserver
            namespace: default
          spec:
            selector:
              app: berth-apiserver-fixture
            ports:
              - port: 8443
                targetPort: 8443
          APISERVER_EOF
          kubectl -n default rollout status deploy/berth-apiserver --timeout=120s

      - name: Run ct install
        run: ct install --config .github/ct.yaml
