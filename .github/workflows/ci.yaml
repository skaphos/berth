name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify generated artifacts
        run: |
          make generate
          make manifests
          git diff --exit-code

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Build API server image
        run: docker build -f Dockerfile.apiserver .

      - name: Build operator image
        run: docker build -f Dockerfile.operator .
