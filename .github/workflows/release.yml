name: Release

# Triggered by a tag matching v* (pushed by release-tag.yml after a
# release-please PR merges). Builds and pushes the three Berth
# container images and the two Helm charts to GHCR, then publishes a
# GitHub release with auto-generated notes.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: skaphos
  CHART_NAMESPACE: skaphos/charts

jobs:
  release:
    name: Build + publish images and charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute version + image refs
        id: vars
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          APISERVER_IMG="${REGISTRY}/${IMAGE_NAMESPACE}/berth-apiserver:v${VERSION}"
          OPERATOR_IMG="${REGISTRY}/${IMAGE_NAMESPACE}/berth-operator:v${VERSION}"
          BROKER_IMG="${REGISTRY}/${IMAGE_NAMESPACE}/berth-oidc-broker:v${VERSION}"
          {
            echo "version=${VERSION}"
            echo "apiserver_img=${APISERVER_IMG}"
            echo "operator_img=${OPERATOR_IMG}"
            echo "broker_img=${BROKER_IMG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build + push apiserver image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.apiserver
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.apiserver_img }}
          provenance: true
          sbom: true

      - name: Build + push operator image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.operator
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.operator_img }}
          provenance: true
          sbom: true

      - name: Build + push oidc-broker image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.broker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.broker_img }}
          provenance: true
          sbom: true

      - name: Package + push Helm charts as OCI artifacts
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist/charts
          # Pin both charts to the release version so consumers can pull
          # `helm pull oci://ghcr.io/skaphos/charts/berth-apiserver --version X.Y.Z`
          # (Helm chart versions are plain semver — no leading `v`).
          helm package deploy/helm/berth-apiserver \
            --version "${VERSION}" --app-version "${VERSION}" \
            --destination dist/charts
          helm package deploy/helm/berth-operator \
            --version "${VERSION}" --app-version "${VERSION}" \
            --destination dist/charts
          helm push "dist/charts/berth-apiserver-${VERSION}.tgz" \
            "oci://${REGISTRY}/${CHART_NAMESPACE}"
          helm push "dist/charts/berth-operator-${VERSION}.tgz" \
            "oci://${REGISTRY}/${CHART_NAMESPACE}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/charts/berth-apiserver-${{ steps.vars.outputs.version }}.tgz
            dist/charts/berth-operator-${{ steps.vars.outputs.version }}.tgz
          generate_release_notes: true
