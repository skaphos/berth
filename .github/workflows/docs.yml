name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install docs tooling
        run: python -m pip install --upgrade pip "mkdocs-material==9.6.22" "mike==2.1.3"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build site
        run: mkdocs build --strict

      - name: Publish main docs
        if: github.ref == 'refs/heads/main'
        run: |
          mike deploy --push --update-aliases main
          mike set-default --push --allow-undefined latest

      - name: Publish release docs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          mike deploy --push --update-aliases "${VERSION}" latest
          mike set-default --push latest
