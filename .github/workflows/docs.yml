name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release docs version to publish, with or without a leading v (for example, v0.2.0)."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Install docs tooling
        run: python -m pip install --upgrade pip "mkdocs-material==9.7.6" "mike==2.2.0"

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build site
        run: mkdocs build --strict

      - name: Publish main docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mike deploy --push --update-aliases main
          mike set-default --push --allow-undefined latest

      - name: Publish release docs
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          VERSION="${REF_NAME#v}"
          mike deploy --push --update-aliases "${VERSION}" latest
          mike set-default --push latest
