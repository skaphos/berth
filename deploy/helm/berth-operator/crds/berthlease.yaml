            - message: holderIdentity is immutable
              rule: self.holderIdentity == oldSelf.holderIdentity
            - message: target is immutable
              rule: has(self.target) == has(oldSelf.target) && (!has(self.target)
                || self.target == oldSelf.target)
            - message: releaseAction is immutable
              rule: has(self.releaseAction) == has(oldSelf.releaseAction) && (!has(self.releaseAction)
                || self.releaseAction == oldSelf.releaseAction)
          status:
            description: BerthLeaseStatus reports the observed state of a Berth lease.
            properties:
              acquiredAt:
                description: AcquiredAt is the timestamp when the lease was last acquired.
                format: date-time
                type: string
              conditions:
                description: Conditions represent the latest observations of the lease's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentHolder:
                description: CurrentHolder is the identity of the entity currently
                  holding the lease.
                type: string
              expiresAt:
                description: ExpiresAt is the timestamp when the lease will expire
                  if not renewed.
                format: date-time
                type: string
              fencingToken:
                description: |-
                  FencingToken is the monotonic fencing token returned by the central
                  API server on the most recent successful Acquire/Renew. Workload cleanup
                  retains its exact release identity separately until Pods have stopped.
                format: int32
                type: integer
              lastHeartbeat:
                description: LastHeartbeat is the timestamp of the most recent lease
                  renewal.
                format: date-time
                type: string
              leaseState:
                description: LeaseState is the current state of the lease (e.g. "held",
                  "released", "expired").
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent .metadata.generation observed by
                  the operator. It is set on every status write so clients can tell
                  whether status reflects the current spec.
                format: int64
                minimum: 0
                type: integer
              tenant:
                description: Tenant is the resolved tenant identifier for the current
                  holder.
                type: string
              workload:
                description: |-
                  Workload records admission and cleanup responsibility independently of
                  the last central API response. Only the operator may write status.
                properties:
                  deadline:
                    description: Deadline is the conservative local expiry deadline
                      for this activation.
                    format: date-time
                    type: string
                  holder:
                    type: string
                  leaseName:
                    description: LeaseName and Holder retain the exact central identity
                      used at activation.
                    type: string
                  phase:
                    description: |-
                      Phase is empty before activation, Active while permitting starts, and
                      Stopping until all permitted Pods have terminated.
                    enum:
                    - ""
                    - Active
                    - Stopping
                    type: string
                  pods:
                    description: |-
                      Pods contains every UID whose gate may have been removed. A Pending Pod
