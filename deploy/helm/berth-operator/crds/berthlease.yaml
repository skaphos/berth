  names:
    kind: BerthLease
    listKind: BerthLeaseList
    plural: berthleases
    singular: berthlease
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: BerthLease is the schema for the BerthLease API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BerthLeaseSpec declares the desired state for a Berth lease.
            properties:
              acquireAction:
                description: |-
                  AcquireAction defines the action applied to the target workload when
                  the lease is acquired.
                properties:
                  scale:
                    description: |-
                      Scale, when non-nil, sets the replica count on the target workload's
                      scale subresource. Applies to workload kinds that expose a scale
                      subresource, such as Deployment, StatefulSet, and ReplicaSet.
                    properties:
                      replicas:
                        description: |-
                          Replicas is the desired replica count. Use 0 to scale a workload down
                          to zero (for example, on lease release).
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - replicas
                    type: object
                  suspend:
                    description: |-
                      Suspend, when non-nil, sets the suspend field on the target workload.
                      Setting this to true pauses the workload; false resumes it. Applies to
                      workload kinds that expose a spec.suspend field, such as CronJob.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: at most one of suspend or scale may be set
                  rule: '!(has(self.suspend) && has(self.scale))'
              heartbeatIntervalSeconds:
                description: |-
                  HeartbeatIntervalSeconds is the interval at which the holder must
                  renew the lease to prevent TTL expiration.
                format: int32
                type: integer
              holderIdentity:
                description: HolderIdentity identifies the entity requesting or holding
                  the lease.
                maxLength: 253
                type: string
              leaseName:
                description: LeaseName is the unique identifier for this lease within
                  its namespace.
                maxLength: 253
                type: string
              releaseAction:
                description: |-
                  ReleaseAction defines the action applied to the target workload when
                  the lease is released or expires.
                properties:
                  scale:
                    description: |-
                      Scale, when non-nil, sets the replica count on the target workload's
                      scale subresource. Applies to workload kinds that expose a scale
                      subresource, such as Deployment, StatefulSet, and ReplicaSet.
                    properties:
                      replicas:
                        description: |-
                          Replicas is the desired replica count. Use 0 to scale a workload down
                          to zero (for example, on lease release).
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - replicas
                    type: object
                  suspend:
                    description: |-
                      Suspend, when non-nil, sets the suspend field on the target workload.
                      Setting this to true pauses the workload; false resumes it. Applies to
                      workload kinds that expose a spec.suspend field, such as CronJob.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: at most one of suspend or scale may be set
                  rule: '!(has(self.suspend) && has(self.scale))'
              semantics:
                description: |-
                  Semantics selects the lease-window behavior. "at-most-once" is the
                  implemented exclusive-holder mode. "at-least-once" is accepted by the
                  schema but currently behaves as exclusive-holder mode until the central
                  API server implements at-least-once lease windows.
                enum:
                - at-most-once
                - at-least-once
                type: string
              target:
                description: |-
                  Target is an optional reference to a workload the operator manages
                  in response to lease state transitions.
                properties:
                  apiVersion:
                    description: APIVersion is the API group and version of the target
                      resource (e.g. "apps/v1").
                    maxLength: 63
                    type: string
                  kind:
                    description: Kind is the resource kind of the target (e.g. "Deployment").
                    maxLength: 63
                    type: string
                  name:
                    description: Name is the name of the target resource in the same
                      namespace as the lease.
                    maxLength: 253
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
              ttlSeconds:
                description: |-
                  TTLSeconds is the time-to-live for the lease in seconds. The lease
                  expires if not renewed within this duration.
                format: int32
                type: integer
            required:
            - heartbeatIntervalSeconds
            - holderIdentity
            - leaseName
            - semantics
            - ttlSeconds
            type: object
            x-kubernetes-validations:
