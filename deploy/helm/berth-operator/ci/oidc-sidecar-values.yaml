image:
  repository: berth-operator
  tag: ci
  pullPolicy: IfNotPresent
clusterID: cluster-oidc
berth:
  apiServer: https://berth.example.com:8443
  tls:
    caBundleConfigMap: berth-ca-bundle
sidecarBroker:
  enabled: true
  oidc:
    issuerURL: https://issuer.example.com
    audience: berth-api
    clientID: berth-operator
    clientSecret:
      secretName: berth-oidc-client
      secretKey: client-secret
metrics:
  serviceMonitor:
    enabled: true
