image:
  repository: berth-operator
  tag: ci
  pullPolicy: IfNotPresent
clusterID: cluster-oidc
berth:
  apiServer: https://berth.example.com:8443
  tls:
    caBundleConfigMap: berth-ca-bundle
sidecarBroker:
  enabled: true
  image:
    repository: berth-oidc-broker
    tag: ci
    pullPolicy: IfNotPresent
  oidc:
    issuerURL: https://issuer.example.com
    audience: berth-api
    clientID: berth-operator
    clientSecret:
      secretName: berth-oidc-client
      secretKey: client-secret
# ServiceMonitor render is covered by `ct lint`; `ct install` needs
# the Prometheus Operator CRDs which kind doesn't bundle. Leave the
# render path off here.
metrics:
  serviceMonitor:
    enabled: false
