# Exercises the berth-acquire injection webhook path (SKA-440): webhook
# Service, cert-manager Certificate, and MutatingWebhookConfiguration.
image:
  repository: berth-operator
  tag: ci
  pullPolicy: IfNotPresent
clusterID: cluster-east
berth:
  apiServer: https://berth-apiserver.default.svc:8443
  apiKey:
    secretName: berth-api-key
    secretKey: api-key
  tls:
    caBundleConfigMap: berth-ca-bundle
    # CI-only: the in-cluster fixture apiserver's test cert has no SAN.
    insecureSkipVerify: true
injection:
  enabled: true
  helper:
    repository: ghcr.io/skaphos/berth-acquire
    tag: ci
    apiKeyFile: /var/run/berth/token
    apiKeySecret:
      name: berth-api-key
      key: api-key
  defaults:
    mode: runtime-singleton
    enforce: probe
    ttlSeconds: 30
  webhook:
    failurePolicy: Fail
    tls:
      certManager:
        enabled: true
        issuerRef:
          name: berth-ca
          kind: ClusterIssuer
