{{- if .Values.injection.enabled -}}
{{- include "berth-operator.validate" . -}}
{{- $tls := .Values.injection.webhook.tls -}}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "berth-operator.webhookName" . }}
  labels:
    {{- include "berth-operator.labels" . | nindent 4 }}
  {{- if $tls.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "berth-operator.webhookName" . }}
  {{- end }}
webhooks:
  - name: inject.berth.skaphos.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.injection.webhook.failurePolicy }}
    reinvocationPolicy: Never
    matchPolicy: Equivalent
    timeoutSeconds: {{ .Values.injection.webhook.timeoutSeconds | int }}
    clientConfig:
      service:
        name: {{ include "berth-operator.webhookName" . }}
        namespace: {{ .Release.Namespace }}
        path: /mutate--v1-pod
        port: {{ .Values.injection.webhook.servicePort | int }}
      {{- if and $tls.existingSecret $tls.caBundle }}
      caBundle: {{ $tls.caBundle }}
      {{- end }}
    rules:
      {{- /* pods/ephemeralcontainers is a second admission path: kubectl
             debug attaches a container to an already-running pod and can
             mount volumes the pod already declares. Without this rule the
             reserved-state-volume check never sees such a request. */}}
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
        scope: Namespaced
    {{- /* Never mutate the Berth control plane. Combined with any
           user-supplied namespaceSelector matchExpressions. */ -}}
    {{- $nsSel := deepCopy .Values.injection.webhook.namespaceSelector }}
    {{- $skipNamespaces := prepend .Values.injection.controlPlaneNamespaces .Release.Namespace | uniq }}
    {{- $skipExpr := dict "key" "kubernetes.io/metadata.name" "operator" "NotIn" "values" $skipNamespaces }}
    {{- $exprs := append (default (list) $nsSel.matchExpressions) $skipExpr }}
    {{- $_ := set $nsSel "matchExpressions" $exprs }}
    namespaceSelector:
      {{- toYaml $nsSel | nindent 6 }}
    {{- with .Values.injection.webhook.objectSelector }}
    objectSelector:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
