{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "berth-operator.fullname" . }}
  labels:
    {{- include "berth-operator.labels" . | nindent 4 }}
rules:
  {{- with .Values.rbac.berthLeaseVerbs }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  {{- with .Values.rbac.targetVerbs }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if or .Values.rbac.leaderElection .Values.leaderElection.enabled }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "berth-operator.fullname" . }}
  labels:
    {{- include "berth-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "berth-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "berth-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
