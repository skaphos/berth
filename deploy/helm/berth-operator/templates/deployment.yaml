apiVersion: apps/v1
kind: Deployment
metadata:
  name: berth-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: berth-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: berth-operator
    spec:
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
