image:
  repository: berth-apiserver
  tag: ci
  pullPolicy: IfNotPresent
# API server runs outside the coordination cluster; uses an external kubeconfig.
replicaCount: 2
store:
  backend: k8s
coordination:
  namespace: berth-coordination
  inCluster: false
  kubeconfig:
    secretName: berth-coordination-kubeconfig
    secretKey: kubeconfig
tls:
  certManager:
    enabled: false
  existingSecret: berth-apiserver-test-tls
# OIDC paths are covered by internal/auth unit tests. ct install
# needs a reachable issuer for discovery; static-keys keeps the
# install path self-contained while still validating the external-
# kubeconfig coordination backend (the point of this ci file).
auth:
  mode: static-keys
  staticKeys:
    secretName: berth-api-keys
    secretKey: api-keys
