image:
  repository: berth-apiserver
  tag: ci
  pullPolicy: IfNotPresent
# API server runs outside the coordination cluster; uses an external kubeconfig.
replicaCount: 2
coordination:
  namespace: berth-coordination
  inCluster: false
  kubeconfig:
    secretName: berth-coordination-kubeconfig
    secretKey: kubeconfig
tls:
  certManager:
    enabled: false
  existingSecret: berth-apiserver-test-tls
auth:
  mode: oidc
  oidc:
    issuerURL: https://issuer.example.com
    audience: berth-api
    requiredClaims:
      - groups=berth-clients
