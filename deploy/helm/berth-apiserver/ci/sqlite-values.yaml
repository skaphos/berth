image:
  repository: berth-apiserver
  tag: ci
  pullPolicy: IfNotPresent
replicaCount: 1
store:
  backend: sql
  sql:
    driver: sqlite
    dsn: ""
    dsnSecret:
      name: berth-sqlite-dsn
      key: dsn
    migrate: auto
coordination:
  namespace: ""
  inCluster: false
  kubeconfig:
    secretName: ""
    secretKey: kubeconfig
tls:
  certManager:
    enabled: false
  existingSecret: berth-apiserver-test-tls
auth:
  mode: none
podDisruptionBudget:
  enabled: false
