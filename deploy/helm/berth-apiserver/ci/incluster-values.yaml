image:
  repository: berth-apiserver
  tag: ci
  pullPolicy: IfNotPresent
# API server runs inside the coordination cluster; RBAC rendered by the chart.
replicaCount: 2
store:
  backend: k8s
coordination:
  namespace: berth-coordination
  inCluster: true
  kubeconfig:
    secretName: ""
    secretKey: kubeconfig
tls:
  certManager:
    enabled: false
  existingSecret: berth-apiserver-test-tls
auth:
  mode: static-keys
  staticKeys:
    secretName: berth-api-keys
    secretKey: api-keys

# Use a stable, pre-provisioned ServiceAccount (created + granted coordination
# Lease RBAC in the workflow before ct install). This ensures that the first
# readiness probes (which now perform a real store Ping per SKA-450) succeed
# immediately rather than racing with Helm resource creation + RBAC propagation.
serviceAccount:
  create: false
  name: berth-apiserver-ci
