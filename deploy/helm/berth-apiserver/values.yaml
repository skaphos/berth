# Default values for berth-apiserver.
# values.schema.json validates inputs at render time.

# -- Container image.
image:
  repository: ghcr.io/skaphos/berth-apiserver
  tag: ""              # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

# -- Pull secrets referenced by the pod spec.
imagePullSecrets: []

# -- Override the chart name in resource names.
nameOverride: ""
fullnameOverride: ""

# -- Number of replicas. Multi-replica is safe with the k8s backend and with
# sql backed by Postgres or MariaDB/MySQL. Use replicaCount: 1 for mem and
# sqlite.
replicaCount: 2

# -- Lease store backend selection.
#
# Set `store.backend` to render the matching API server backend flags.
#
# Backends:
#   mem  Single-replica in-memory store. Dev/demo only — state is lost on
#        restart. Use only with replicaCount: 1.
#   k8s  coordination.k8s.io/v1.Lease objects in a separate cluster, see
#        the `coordination` block below. Multi-replica safe.
#   sql  Postgres, MariaDB/MySQL, or SQLite. Multi-replica safe (Postgres
#        and MariaDB). See `store.sql` and SKA-316 for the runner-local
#        deployment topology.
#
# When `store.backend` is empty the API server falls back to a legacy
# heuristic on --coordination-namespace (empty → mem, set → k8s) and logs
# a deprecation warning. Set `store.backend` explicitly.
store:
  backend: ""
  sql:
    driver: ""          # postgres | mysql | sqlite
    # dsn vs dsnSecret are mutually exclusive. Prefer dsnSecret in
    # production; the chart mounts the Secret and passes --sql-dsn-file.
    # The apiserver reads the mounted file at startup; restart pods after
    # credential rotation.
    dsn: ""
    dsnSecret:
      name: ""
      key: dsn
    migrate: auto       # auto | off

# -- coordination.k8s.io/v1.Lease backend settings. Only consulted when
# `store.backend` is "k8s" (or unset and falling back via the legacy
# heuristic).
#
# Two modes:
# 1. inCluster: true   — the API server runs inside the coordination cluster
#                         itself and uses the pod's ServiceAccount. The chart
#                         renders a Role + RoleBinding granting CRUD on
#                         coordination.k8s.io/v1.Lease in `namespace`.
# 2. inCluster: false  — the API server runs in a different cluster and
#                         reads `namespace`'s Leases via an external
#                         kubeconfig stored in a Secret in this release.
#                         The Secret's `kubeconfig.secretKey` data field
#                         must contain a kubeconfig pointed at the
#                         coordination cluster.
coordination:
  namespace: ""
  inCluster: false
  kubeconfig:
    secretName: ""
    secretKey: kubeconfig

# -- TLS certificate for the API server's listener. Exactly one of
# `certManager.enabled` or `existingSecret` must be set.
tls:
  # cert-manager-issued Certificate. Renders a Certificate resource that
  # writes tls.crt + tls.key + ca.crt into a Secret the Deployment mounts.
  certManager:
    enabled: false
    issuerRef: {}    # e.g. { name: berth-ca, kind: ClusterIssuer }
    duration: 8760h  # 1 year
    renewBefore: 720h  # 30 days
    dnsNames: []     # additional names beyond the Service ClusterIP DNS
  # Pre-created Secret with kubernetes.io/tls type (tls.crt + tls.key).
  existingSecret: ""

# -- Authentication mode applied to lease endpoints. `/healthz` is always
# unauthenticated.
auth:
  # none | static-keys | oidc
  # Default: none — chart users MUST opt-in to static-keys or oidc.
  # Render fails if mode=static-keys without a Secret, or mode=oidc
  # without an issuerURL/audience. See _validations.tpl.
  mode: none

  staticKeys:
    # Name of a Secret in the release namespace with a single data key
    # `api-keys` containing `<key-id>:<sha256-hex>` lines.
    secretName: ""
    secretKey: api-keys

  oidc:
    issuerURL: ""
    audience: ""
    jwksURL: ""
    usernameClaim: ""
    tenantClaim: ""
    # Repeatable claim-equality constraints, e.g. groups=berth-clients.
    requiredClaims: []

# -- Service exposing the API.
service:
  type: ClusterIP
  port: 8443

# -- Prometheus metrics. The API server serves /metrics on a SEPARATE,
# unauthenticated plain-HTTP port (off the TLS/auth path), mirroring the
# operator's controller-runtime endpoint. Restrict the port to the monitoring
# stack with a NetworkPolicy — it exposes no lease data, only RED + store-call
# series, but it is unauthenticated by design.
metrics:
  enabled: true
  port: 8080
  # Add the metrics port to the Service so a ServiceMonitor can target it.
  service:
    enabled: true
  # Prometheus Operator ServiceMonitor. Requires the monitoring.coreos.com
  # CRDs; leave disabled if you scrape via pod annotations or another path.
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels on the ServiceMonitor (e.g. to match a Prometheus
    # serviceMonitorSelector).
    additionalLabels: {}
    relabelings: []
    metricRelabelings: []
  # Alternative to a ServiceMonitor: prometheus.io/* scrape annotations on the
  # pod, for Prometheus configured with the kubernetes_sd pod role.
  podAnnotations:
    enabled: false

# -- Optional Ingress fronting the Service. Off by default; users hosting
# a single cluster usually just expose the Service.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: berth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- PodDisruptionBudget so a node drain cannot evict every replica.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  # maxUnavailable: # mutually exclusive with minAvailable

# -- Container resource requests / limits.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# -- Pod-level securityContext.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level securityContext.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Liveness / readiness probes hit /healthz on the TLS listener.
livenessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /healthz
    port: https
    scheme: HTTPS
  initialDelaySeconds: 2
  periodSeconds: 5

# -- Scheduling.
nodeSelector: {}
tolerations: []
# Default: pod anti-affinity across nodes so replicas don't all land on one box.
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: berth-apiserver

# -- Extra command-line arguments appended to the apiserver invocation.
# Use to set fields the chart has not yet templated (e.g. an experimental
# --feature flag) without modifying the chart.
extraArgs: []

# -- Extra environment variables on the apiserver container.
extraEnv: []

# -- Extra volumes / mounts (for sidecars, CA bundles, etc.).
extraVolumes: []
extraVolumeMounts: []

# -- ServiceAccount.
serviceAccount:
  create: true
  name: ""
  annotations: {}
