apiVersion: v2
name: berth-apiserver
description: |
  Berth coordination API server. Runs N replicas in a dedicated control
  plane and persists lease state into coordination.k8s.io Lease objects
  on a coordination cluster, so all replicas share a single source of
  truth via kube-apiserver compare-and-swap.
type: application
kubeVersion: ">=1.27.0-0"
version: 0.2.0
appVersion: "0.2.0"
home: https://github.com/skaphos/berth
sources:
  - https://github.com/skaphos/berth
keywords:
  - berth
  - lease
  - coordination
  - skaphos
maintainers:
  - name: Skaphos
    url: https://github.com/skaphos
