#
# Berth operator values shared by both east and west e2e clusters.
# The harness overrides clusterID and berth.apiServer per-cluster via
# `helm install --set` because the API server URL is the runtime-discovered
# `https://<coord-control-plane-IP>:<NodePort>`.

image:
  repository: berth-operator
  tag: e2e
  pullPolicy: IfNotPresent

# clusterID is required and supplied per-release at install time.
clusterID: ""

installCRDs: true

berth:
  # apiServer is supplied per-release at install time.
  apiServer: ""
  apiKey:
    secretName: berth-api-key
    secretKey: api-key
  tls:
    # The harness-issued cert SAN can't include a yet-to-be-assigned
    # container IP, so e2e uses skip-verify. Production never does.
    insecureSkipVerify: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 192Mi

metrics:
  serviceMonitor:
    enabled: false

# Exercise the berth-acquire injection webhook (SKA-441). The webhook serving
# cert (existingSecret + caBundle) is generated and passed per-cluster by up.sh
# because the caBundle is the freshly minted self-signed cert. The injected
# helper inherits berth.* above (apiServer/insecureSkipVerify) and reads its
# bearer token from injection.helper.apiKeyFile, which the test workload mounts.
injection:
  enabled: true
  helper:
    repository: berth-acquire
    tag: e2e
    pullPolicy: IfNotPresent
    apiKeyFile: /var/run/berth/api-key
    # SKA-444: the webhook mounts the bearer token from this Secret into each
    # opted-in pod at apiKeyFile. up.sh creates `berth-api-key` (key `api-key`)
    # in berth-system and injection_test.go copies it into the inject-e2e
    # namespace. The chart requires apiKeySecret whenever apiKeyFile is set.
    apiKeySecret:
      name: berth-api-key
      key: api-key
  defaults:
    mode: runtime-singleton
    enforce: probe
    ttlSeconds: 15
  webhook:
    # Ignore so a webhook hiccup can't wedge the shared runner cluster; the
    # injection test asserts the mutation happened, so a non-firing webhook
    # still fails loudly.
    failurePolicy: Ignore
